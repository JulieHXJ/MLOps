[project]
name = "dg_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.6",
    "dagster-dg-cli>=1.13.6",
    "dagster-webserver>=1.13.6",
    "fastapi>=0.136.3",
    "lakefs>=0.16.0",
    "lakefs-spec>=0.14.0",
    "mlflow>=3.13.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.48.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dg_pipeline"
registry_modules = [
    "dg_pipeline.components.*",
]


